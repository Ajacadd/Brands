      if(SAVE_EXT.has(ex)) fetchBlob(f.assetId).then(bl => saveAs(`${safeName(b?.name)} - ${safeName(f.title||f.filename)}.${ex}`, bl)).catch(()=>toast("تعذّر جلب الملف"));
      else zipSave(`${safeName(b?.name)} - ${safeName(f.title||f.filename)}.zip`, z => addFiles(z, "", [f])); } break;
    case "pack": if(b) packZip(b, t.dataset.k); break;
    case "exp": if(f && b) exportImg(b, f, t.dataset.fmt, +t.dataset.s); break;
    case "dl-font": { const ff = b?.fonts?.[+t.dataset.i]; if(ff && S.downloads) zipSave(`${zipName(ff.name||"font")}.zip`, async z => { const list = await collectFamily(b, ff); await addFiles(z, zipName(ff.name||"font"), list); }); break; }
    case "copy-css": if(b){ const css = ":root {\n" + (b.colors||[]).map((c,i)=>{ const h = hexNorm(c.hex); if(!h) return null; const n = (c.name||"").trim() ? c.name.trim().replace(/\s+/g,"-") : "color-" + (i+1); return `  --${n}: ${h};`; }).filter(Boolean).join("\n") + "\n}"; copy(css, "متغيرات CSS"); } break;
    case "copy-hexes": if(b) copy((b.colors||[]).map(c => `${c.name||"لون"}: ${hexNorm(c.hex)}`).join("\n"), "كل الأكواد"); break;
    case "copy-prompt": copy($("#promptText")?.textContent || "", "البرومبت"); break;
    case "prompt-view": S.promptView = t.dataset.v; renderMain(); break;
    case "ai-prompt": b && aiPrompt(b); break;
    case "approve-ai": if(b && S.aiDraft){ touch(b.id, {promptFinal:S.aiDraft}).then(()=>{ S.promptView = "final"; toast("تم اعتماد البرومبت"); }).catch(e=>toast(msgFor(e))); } break;
  }
});
document.addEventListener("click", e => { document.querySelectorAll("details.menu[open]").forEach(d => { if(!d.contains(e.target)) d.removeAttribute("open"); }); });
window.addEventListener("hashchange", () => { S.promptView = null; S.aiDraft = null; render(); window.scrollTo(0,0); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderNav, 200); });
$("#q").addEventListener("input", e => { S.q = e.target.value; const v = route().view; if(v === "brand" && S.q.trim()) location.hash = "home"; else renderMain(); });

/* ---------- boot ---------- */
const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
/* standalone copy: read-only in-memory store with the same calls the page uses */
function offlineDb(data){
  const snapOf = list => ({docs:list.map(d => ({id:d.id, exists:true, data:() => d.data, metadata:{fromCache:false, hasPendingWrites:false}})), size:list.length, empty:!list.length, metadata:{fromCache:false, hasPendingWrites:false}});
  const listFor = p => p === "brands" ? data.brands : ((/^brands\/([^/]+)\/files$/.exec(p)||[])[1] ? (data.files[p.split("/")[1]] || []) : []);
  const coll = (p, filt) => { const items = () => listFor(p).filter(d => !filt || filt(d.data));
    return {onSnapshot:(next) => { setTimeout(() => next(snapOf(items())), 0); return () => {}; }, get:async () => snapOf(items()),
      where:(f, op, v) => coll(p, d => op === "==" ? d[f] === v : true), doc:() => ({set:async()=>{}, update:async()=>{}, delete:async()=>{}})}; };
  return {collection:p => coll(p), doc:() => ({set:async()=>{}, update:async()=>{}, delete:async()=>{}, get:async()=>({exists:false, data:()=>undefined})})};
}
render();
(async () => {
  if(OFF){
    S.db = offlineDb(OFF);
    S.downloads = {save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data]); const u = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return {status:"saved"}; }};
    subBrands();
    /* hosted as a Claude page: link downloads are blocked there, so use the viewer's download capability when it is offered */
    const dl = await use("downloads"); if(dl){ S.downloads = dl; renderMain(); }
    return;
  }
  const db = await use("db");
  if(!db){ S.dbState = "nodb"; S.loaded = true; render(); return; }
  S.db = db; subBrands();
  const [user, assets, downloads, sample] = await Promise.all([use("user"), use("assets"), use("downloads"), use("sample")]);
  S.user = user; S.assets = assets; S.downloads = downloads; S.sample = sample;
  S.canEdit = user ? await user.canEdit().catch(() => false) : false;
  render();
})();
})();
</script>
