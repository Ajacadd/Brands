<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>مكتبة هوية الأجيال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Somar Sans — the academy's secondary typeface, served from the library's own uploaded font files */
@font-face{font-family:"Somar Sans";font-weight:300;font-display:swap;src:url(assets/3deea33c4641b370714b9a2a1b7df593.otf) format("opentype")}
@font-face{font-family:"Somar Sans";font-weight:400;font-display:swap;src:url(assets/c7f9821699ef3b466eb4bfeef79e1d36.otf) format("opentype")}
@font-face{font-family:"Somar Sans";font-weight:500;font-display:swap;src:url(assets/44659f855c27442067d6a6ba9024c4cb.otf) format("opentype")}
@font-face{font-family:"Somar Sans";font-weight:600;font-display:swap;src:url(assets/0862cfa70cbe1d8460a9e5d90b6976d8.otf) format("opentype")}
@font-face{font-family:"Somar Sans";font-weight:700;font-display:swap;src:url(assets/725445088e42b1790a8d77621b0ce7e0.otf) format("opentype")}
@font-face{font-family:"Somar Sans";font-weight:800;font-display:swap;src:url(assets/e7dd7a7e9a39872f9584737a274b23ec.otf) format("opentype")}
/* Layout: light academy sidebar (identity index) + scrolling brand sheet. Academy identity: navy #003375 leads, pink #F280AA highlights, cyan #38B5DA supports; Alexandria for headings, Somar Sans for text */
:root{
  --bg:#F4F4F7; --surface:#FFFFFF; --sunk:#ECEDF3; --ink:#003375; --text:#1F2A44; --muted:#6D6E71; --line:#E6E7EE;
  --accent:#003375; --accent-ink:#FFFFFF; --accent-soft:#E6EEF8;
  --pink:#F280AA; --pink-soft:#FDE6EF; --pink-ink:#B03A6A; --cyan:#38B5DA; --cream:#FDF2E3;
  --side:#FFFFFF;
  --danger:#C42B5A; --ok:#1A9D6B;
  --check-a:#FFFFFF; --check-b:#ECEDF3; --mark:#B1B3B6;
  --f-display:"Alexandria","Somar Sans","Segoe UI",Tahoma,sans-serif;
  --f-body:"Somar Sans","Alexandria","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:16px;
  color-scheme:light;
}
/* light-only by request: no dark theme */

body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.75;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
h1,h2,h3{color:var(--ink)}
*{box-sizing:border-box}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.mono,[dir="ltr"].mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--side);color:var(--ink);border-inline-end:1px solid var(--line);
  padding-block:24px;padding-right:max(18px,env(safe-area-inset-right,0px));padding-left:18px;display:flex;flex-direction:column;gap:18px}
.brandmark{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.brandmark img{height:48px;width:auto;align-self:flex-start}
.brandmark b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2;font-weight:700}
.brandmark small{color:var(--pink-ink);font-size:12.5px;font-family:var(--f-body)}
.brandmark .fallback{font-family:var(--f-display);font-weight:800;font-size:18px}
.search{position:relative}
.search input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
#nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:99px;text-decoration:none;color:var(--text);font-size:14px;min-width:0}
.nav-i span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i:hover{background:var(--sunk);color:var(--ink)}
.nav-i.on{background:var(--pink);color:#fff;font-weight:600}
.nav-i i{width:10px;height:10px;border-radius:3px;flex:none;background:var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.nav-i.on i{box-shadow:0 0 0 1.5px #fff}
.nav-h{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 12px 4px;font-size:12px;letter-spacing:.03em;color:var(--pink-ink);font-weight:600;font-family:var(--f-display)}
.nav-h .mono{color:var(--muted)}
.nav-h a{text-decoration:none}
.nav-h a:hover{color:var(--ink)}
.nav-empty{padding:4px 12px;color:var(--muted);font-size:13px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.side-foot .who{font-size:12px;color:var(--muted)}

main{min-width:0;padding-block:28px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:34px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:99px;color:var(--ink);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn[disabled]{opacity:.55;cursor:progress}
.icon-btn{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.intro{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}
.intro h1{font-size:clamp(24px,3vw,32px)}
.intro p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:13px;letter-spacing:.03em;color:var(--pink-ink);font-weight:600;font-family:var(--f-display)}

/* home hero — light card, academy logo with slogan */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pink);
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding:clamp(24px,4vw,44px)}
.hero-txt{position:relative;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(26px,3.6vw,40px);font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted)}
.hero-stats b{color:var(--ink);font-size:20px;font-family:var(--f-display);margin-inline-end:4px}
.hero-mark{position:relative;display:flex;justify-content:center;align-items:center}
.hero-mark img{width:min(300px,85%)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--pink);flex:none}
.sec-h .count{color:var(--muted);font-size:13px;font-family:var(--f-mono)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(1,26,74,.45)}
.card-art{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;padding:18px;border-bottom:4px solid var(--c,var(--line));background:var(--check-a)}
.card-art{position:relative;overflow:hidden}
.card-art img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain}
.mono-init{font-family:var(--f-display);font-weight:700;font-size:34px;color:var(--c,var(--muted))}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{font-size:17px}
.card-body p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:4px;margin-top:auto;padding-top:6px}
.dots span{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.kind{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--pink-soft);color:var(--pink-ink);width:fit-content}
.card.wide{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
.card.wide .card-art{aspect-ratio:auto;min-height:190px;border-bottom:0;border-inline-start:6px solid var(--c,var(--line))}
.card.wide .card-body{padding:22px 24px;gap:8px}
.card.wide h3{font-size:24px}
.card.wide p{-webkit-line-clamp:4}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:500}
.notice{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* brand sheet */
.band{background:var(--band);color:var(--on);border-radius:14px;padding:26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.band-logo{width:150px;height:150px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.band-logo{position:relative;overflow:hidden}
.band-logo img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.band-logo .mono-init{color:var(--band)}
.band .kind{background:rgba(255,255,255,.18);color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.band h1{font-size:clamp(26px,4vw,40px);margin-top:8px;color:inherit;font-weight:800}
.band .en{margin:2px 0 0;opacity:.8;font-size:14px;letter-spacing:.02em}
.band .sum{margin:10px 0 0;max-width:68ch;opacity:.92;white-space:pre-line}
.band-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.band-actions .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:inherit}
.band[data-light] .band-actions .btn{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.25)}
.band-meta{margin-top:10px;font-size:12.5px;opacity:.75}
.parent-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.parent-note a{color:var(--accent)}

.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-block:-20px -10px;border-bottom:1px solid var(--line)}
.subnav button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.subnav button:hover{background:var(--sunk);color:var(--ink)}
section{scroll-margin-top:70px}

/* logo tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.tile-art{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;padding:28px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.tile-art img{position:absolute;inset:28px;width:calc(100% - 56px);height:calc(100% - 56px);object-fit:contain}
.tile-art::after{content:"";position:absolute;inset:9px;pointer-events:none;background:
  linear-gradient(var(--mark),var(--mark)) top right/14px 1px no-repeat,linear-gradient(var(--mark),var(--mark)) top right/1px 14px no-repeat,
  linear-gradient(var(--mark),var(--mark)) top left/14px 1px no-repeat,linear-gradient(var(--mark),var(--mark)) top left/1px 14px no-repeat,
  linear-gradient(var(--mark),var(--mark)) bottom right/14px 1px no-repeat,linear-gradient(var(--mark),var(--mark)) bottom right/1px 14px no-repeat,
  linear-gradient(var(--mark),var(--mark)) bottom left/14px 1px no-repeat,linear-gradient(var(--mark),var(--mark)) bottom left/1px 14px no-repeat}
.bg-checker{background:repeating-conic-gradient(var(--check-b) 0 25%,var(--check-a) 0 50%) 0 0/16px 16px}
.bg-light{background:#FFFFFF;--mark:#B7BCC6}
.bg-dark{background:#121318;--mark:#4A4F5A}
.bg-brand{background:var(--band)}
.ext-label{font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--muted);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--surface);position:relative}
.tile-meta{padding:12px 14px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-meta strong{font-weight:600;overflow-wrap:anywhere}
.tile-meta .v{color:var(--muted);font-size:13px}
.fmt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px 14px;margin-top:auto}
.tile-actions .sp{flex:1}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}

details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;z-index:20;inset-inline-start:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:210px;display:flex;flex-direction:column}
details.menu .pop button,details.menu .pop a{border:0;background:transparent;text-align:start;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;text-decoration:none;font-size:13.5px}
details.menu .pop button:hover,details.menu .pop a:hover{background:var(--sunk)}
details.menu .pop small{color:var(--muted);font-family:var(--f-mono)}
details.menu .pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* swatches */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.swatch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.chip{border:0;height:120px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px 14px;text-align:start}
.chip .hx{font-family:var(--f-mono);font-size:20px;font-weight:500}
.chip small{opacity:.75;font-size:12px}
.sw-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sw-body header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sw-body strong{font-weight:600}
.codes{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:13px;margin:0}
.codes dt{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em}
.codes dd{margin:0;font-family:var(--f-mono);direction:ltr;text-align:right;overflow-wrap:anywhere}
.codes button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px}
.codes button:hover{background:var(--accent-soft)}
.palette-strip{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:14px}
.palette-strip span{flex:1}

/* design-rules page + link cards */
.nav-sep{height:1px;background:var(--line);margin:14px 12px 8px}
.rules-link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;text-decoration:none;padding:18px 22px;border-radius:var(--r);border:1px solid var(--line);border-inline-start:5px solid var(--pink);background:var(--surface);color:var(--text)}
.rules-link:hover{border-color:var(--pink)}
.rules-link .rl-t{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink)}
.rules-link .rl-d{grid-column:1;font-size:13.5px;color:var(--muted)}
.rules-link .rl-a{grid-row:1/3;grid-column:2;font-family:var(--f-display);font-size:14px;color:var(--pink-ink);white-space:nowrap}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.toc button:hover{border-color:var(--pink)}
.rules-doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px clamp(18px,3vw,36px) 30px}
.rules-doc h3{scroll-margin-top:20px;font-size:21px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.rules-doc h3:first-child{border-top:0;margin-top:14px;padding-top:0}
@media (max-width:560px){.rules-link{grid-template-columns:minmax(0,1fr)}.rules-link .rl-a{grid-row:auto;grid-column:1}}

/* general rules */
details.gen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.gen > summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid transparent}
details.gen > summary::-webkit-details-marker{display:none}
details.gen > summary::after{content:"▾";color:var(--pink-ink);transition:transform .15s}
details.gen[open] > summary{border-bottom-color:var(--line)}
details.gen[open] > summary::after{transform:rotate(180deg)}
.md{padding:6px 22px 22px;max-width:none}
.md h3{font-size:19px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.md h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pink)}
.md h4{font-size:15.5px;margin:16px 0 6px;color:var(--ink)}
.md p{margin:6px 0;max-width:80ch}
.md ul{margin:6px 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px;max-width:90ch}
.md ul.check{list-style:none;padding-inline-start:0}
.md ul.check li{display:flex;gap:10px;align-items:flex-start}
.md ul.check .box{flex:none;width:16px;height:16px;border:1.5px solid var(--accent);border-radius:4px;margin-top:5px}
.mdt{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
.mdt table{border-collapse:collapse;width:100%;font-size:14px}
.mdt th,.mdt td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.mdt th{background:var(--sunk);font-family:var(--f-display);font-weight:600;color:var(--ink);white-space:nowrap}
.mdt tr:last-child td{border-bottom:0}
.hexchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.hexchip i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* font weights + download packs */
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.wchip{font-family:var(--f-mono);font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pack{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.pack:hover:not([disabled]){border-color:var(--pink);transform:translateY(-2px)}
.pack[disabled]{opacity:.5;cursor:not-allowed}
.pack .pk-t{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:16px}
.pack .pk-d{font-size:13px;color:var(--muted)}

 الجنسين\nصور Stock مصطنعة أو غريبة الطابع\nثياب أطفال أكبر من سنّهم\nتشبّع لوني عالٍ أو إضاءة قاسية\nباقات ورد كبيرة أو ألوان زاهية أو ورد صناعي ظاهر","dos":"الملوّن على الأبيض والكريمي والرمادي الفاتح — الحالة الافتراضية الأولى\nالأبيض على الخلفيات الغامقة حصرًا: الأزرق الأكاديمي والكحلي العميق والوردي\nعلى الصور: الشعار في المساحة الهادئة، أو داخل مربع أزرق أكاديمي عند ازدحام الخلفية\nالأزرق للعناوين والعناصر الرئيسية والأشرطة، والكحلي للنصوص الطويلة والخلفيات الداكنة\nالوردي لإبراز الكلمات المفتاحية والعناصر التفاعلية بنسب مدروسة، والكريمي خلفية دافئة بديلة عن الأبيض الحاد\nالصور: ضوء فجري ناعم، زوايا خلفية أو جانبية، اليدان مغطاتان أو تحملان كتابًا، بيئة منزلية أو طبيعية هادئة\nلمسة الوردة: 2–3 أزهار وردية صغيرة (أقحوان أو ديزي) في زاوية الصورة خارج البؤرة، لا تتجاوز 10% من المساحة\nألوان الملابس: كحلي، أزرق، رمادي، وردي ترابي، كريمي (تقليل الأسود)","print":"- الحد الأدنى للشعار العريض 30mm مطبوعًا.\n- الكحلي في المراسلات الرسمية والطباعة أحادية اللون على الأبيض.\n- اعتمد قيم CMYK للألوان الأساسية.","voice":"الصياغات المعتمدة: «مؤنسات بالعلم، مؤنسات بالأثر» · «ابنِي نفسكِ بالعلم، ليمتد أثره إلى من تحبين» · «رفيقات في طلب العلم… يجمعهن هدف ورسالة» · «من بصيرةٍ تبنيكِ… إلى أثرٍ يمتد لمن حولكِ».\nشخصية الخطاب: مؤصل بالمرجعية الإسلامية يعظّم العلم النافع؛ مؤنس ومطمئن يلامس الحيرة برفق؛ قريب وإنساني دافئ دون تكلف؛ معتز برسالة الأمومة وصناعة الأجيال؛ واضح ومحفز دون وعود مبالغ فيها.\nالضوابط التحريرية: لا نختزل المؤانسة في العاطفة وحدها؛ لا نصوّر المرأة مسؤولة وحدها عن سكينة الأسرة؛ لا نَعِد بحل جميع التحديات؛ نتجنب الإفراط في الاشتقاقات من كلمة «أنس».\nالشخصيات المستهدفة: الباحثة عن هويتها، المقبلة على الزواج، الأم الحديثة، الأم ذات الأبناء الأكبر."},"summary":"الدفعة العاشرة من دبلوم هندسة الأجيال.\nمفهوم الحملة: العلم والبصيرة والصحبة الصالحة وأثر المرأة المؤهلة في نفسها ومن حولها.\nالرسالة: بالعلم والبصيرة تبنين نفسكِ، وتكتسبين وعيًا يعينكِ على مواجهة التحديات، وتصبحين أقدر على مؤانسة من حولكِ.\nالرمز «10» داخل الشعار يربط الدفعة العاشرة بمسار الأكاديمية والدفعات مساعد"}],"coverAsset":"2d50c00db451008d1a427d618cfbe42d","createdAt":"2026-11-17T00:00:00.000Z","driveFolder":"","fonts":[{"assetId":"","contentType":"","driveUrl":"","filename":"","google":true,"name":"Alexandria","role":"العناوين","usage":"الخط الرئيسي، مزاوج مع اللاتيني Montserrat. Bold للعناوين الرئيسية 28–120pt، وMedium للعناوين الفرعية 18–26pt.","weights":"Medium 500 · ExtraBold 800 (من 9 أوزان)"},{"assetId":"44659f855c27442067d6a6ba9024c4cb","contentType":"font/otf","driveUrl":"","filename":"SomarSans-Medium.otf","google":false,"name":"Somar Sans","role":"النصوص","usage":"الخط الثانوي للنصوص الطويلة والعناوين الفرعية. Medium للنصوص 12–22pt وللثانوية 8–12pt. كل الأوزان في «ملفات الخطوط».","weights":"Light 300 · Regular 400 · Medium 500 · SemiBold 600 · Bold 700 · ExtraBold 800"}],"generalRules":"## أولًا: الهوية البصرية والمعايير العامة\nالهدف هوية يُتعرَّف عليها فور رؤيتها، تجمع بين الرُّقي الأكاديمي والأنوثة الهادئة والدفء الأسري، لا مجرد تصميم جميل.\n\n### 1. الهدف الأساسي\n- بناء هوية متكاملة للمنصة يتعرّف عليها المشاهد فور رؤية التصميم.\n- توحيد تنسيق جميع المنشورات حفاظًا على الهوية البصرية للمؤسسة.\n- الالتزام بألوان أكاديمية هندسة الأجيال وخطوطها الرسمية دون اجتهاد.\n\n### 2. الألوان\nتُستخدم درجات هادئة متناسقة تعكس الطابع الأكاديمي والشرعي، وتُجتنب الألوان الصارخة والتشبع المبالغ فيه في الخلفيات والنصوص.\n\n| اللون | HEX | CMYK | الاستخدام |\n|---|---|---|---|\n| الكحلي (رئيسي) | #003375 | 100, 80, 0, 35 | العناوين الرئيسية والخلفيات والعناصر المحورية |\n| الوردي (رئيسي) | #F280AA | 0, 47, 30, 5 | العناوين الفرعية والعناصر التفاعلية واللمسات الأنثوية |\n| السماوي (رئيسي) | #38B5DA | 74, 17, 0, 15 | الأيقونات والعناصر المساندة والتوضيحية |\n| الكريمي | #FDF2E3 | 0, 4, 10, 0 | الخلفيات الفاتحة |\n| الرمادي الفاتح | #F4F4F7 | 3, 2, 1, 0 | الخلفيات والبطاقات |\n| الوردي الفاتح | #FFD3E4 | 0, 22, 0, 0 | خلفيات العناصر واللمسات الهادئة |\n| وردي النصوص الثانوية | #FDB5C8 | 0, 37, 5, 0 | النصوص الثانوية على الخلفيات الداكنة |\n| وردي التنبيهات | #FC739F | 0, 54, 37, 1 | التنبيهات والعناصر اللافتة |\n| السماوي التفاعلي | #5BD7FB | 64, 14, 0, 2 | العناصر التفاعلية المساندة |\n| رمادي النصوص | #6D6E71 | 4, 3, 0, 56 | النصوص الثانوية والملاحظات |\n| رمادي الفواصل | #B1B3B6 | 3, 2, 0, 29 | الخطوط الفاصلة والإطارات |\n\n- التدرج اللوني يكون بين درجتين متقاربتين فقط، مثل: الكحلي #011A4A ← #023373، أو الوردي #F280AA ← #FDB5C8.\n- لا تُستخدم ألوان من خارج هذا الجدول.\n\n### 3. الخطوط\n- Alexandria: للعناوين الرئيسية والفرعية والأرقام البارزة.\n- Somar Sans: للنصوص والشروحات والمحتوى الطويل.\n- يُستغنى عن خط Readex Pro، ولا تُستخدم الخطوط المزخرفة أو الصعبة القراءة.\n\n### 4. الشعار\n- الشعار الملوّن على الخلفيات الفاتحة (الأبيض، الكريمي، الرمادي الفاتح)، والشعار الأبيض على الكحلي والخلفيات الداكنة والصور.\n- لا يُعدَّل في نسب الشعار ولا ألوانه، وتُترك حوله مساحة الأمان، ولا تُوضع عناصر أساسية داخل هوامش الأمان.\n- يُوضع شعار الأكاديمية، وشعار المشروع إن وُجد، في أماكنهما الثابتة في القوالب المعتمدة.\n\n### 5. الزخارف (Pattern)\n- تُستخدم نقشة الأكاديمية الرسمية في الخلفية بشفافية منخفضة جدًا بين 3% و5%، حتى لا تشوّش على المحتوى.\n- إبراز المحتوى مُقدَّم على الزخرفة.\n\n### 6. الهوامش والمساحات\n- تُترك مساحات آمنة متوازنة حول الشعار والعناصر.\n- تُستخدم مساحات بيضاء كافية لتجنّب الازدحام البصري.\n\n## ثانيًا: التعامل مع النصوص والعناوين\nيُرتَّب النص بحيث تقرأ العين العنوان أولًا، ثم العنوان الثانوي، ثم التفاصيل.\n\n### 1. التسلسل البصري\n- العنوان الرئيسي بأكبر حجم وبخط Alexandria وباللون الكحلي (أو الأبيض على الخلفيات الداكنة).\n- العنوان الثانوي أصغر منه بوضوح، ويمكن أن يكون بالوردي.\n- بقية التفاصيل بخط Somar Sans، وبحجم مقروء دون تكبير أو تصغير مبالغ فيه.\n- يُتجنَّب الفارق الكبير جدًا بين حجم العنوان والنص الذي تحته.\n\n### 2. تنسيق النصوص\n- يُفضَّل توسيط النصوص والعناوين في منشورات التواصل لتحقيق التوازن، وتجنّب تكدّسها في جانب واحد.\n- تُختصر النصوص الطويلة وتُحوَّل إلى نقاط أساسية، ويمكن الاستعانة بأدوات الذكاء الاصطناعي في ذلك، على أن تُراجَع الصياغة قبل اعتمادها.\n- لا تتداخل النصوص مع الصور أو الرسومات.\n\n### 3. التباين (Contrast)\n- نص كحلي أو رمادي داكن على الخلفيات الفاتحة، ونص أبيض على الكحلي والخلفيات الداكنة.\n- الوردي للعناوين القصيرة والعناصر البارزة فقط، ولا تُكتب به فقرات طويلة على خلفية بيضاء لأن تباينه ضعيف.\n\n## ثالثًا: التنسيق العام وإيصال الرسالة\n- توحيد التنسيق في جميع المنشورات.\n- إيصال الرسالة الأساسية للمحتوى بوضوح تام، وأن يحقق التصميم الهدف الذي أُنشئ من أجله.\n- السعي إلى تصاميم إبداعية توحي بالمعنى دون كلمات وتثبت في الذهن.\n- تصميم حديث أنيق منظم، يقوم على البساطة والوضوح والاتزان البصري، دون ازدحام.\n\n## رابعًا: الصور والرسومات والعناصر المساعدة\n### 1. الصور والرسومات\n- تتماشى جميع الصور والرسومات مع القيم والمبادئ الشرعية، وتُتجنَّب الصور المثيرة للجدل أو غير المناسبة.\n- تُفضَّل الزوايا الخلفية والجانبية غير المباشرة دون إظهار ملامح الوجه، أو تكون الوجوه مطموسة.\n- أجواء طبيعية ومنزلية وتعليمية، بإضاءة طبيعية ناعمة وألوان هادئة غير مشبعة.\n- تُتجنَّب الصور الاصطناعية ذات الطابع الغربي وصور المواقع الجاهزة (Stock) غير المناسبة.\n- تُستخدم عناصر رمزية كالكتب والورود والبيوت والشموع، مع التنويع بين ألوان البشرة في المجمل.\n- الصورة التي تقع خلف النص معبّرة عن المضمون لكنها عنصر ثانوي، فتُخفَّض شفافيتها (Opacity) إلى 10–15% حتى لا تطغى على النص.\n\n### 2. الأيقونات (Icons)\n- يُنصح باستخدام الأيقونات، على أن تكون ذات دلالة مرتبطة بالنص.\n- الأسلوب المعتمد خطي (Outline / Line Style) بسمك موحد وأطراف دائرية، وتُتجنَّب الأيقونات الممتلئة (Filled) في التصاميم الرئيسية.\n- الكحلي للأيقونات الرئيسية، والوردي للعناصر التفاعلية، والسماوي للعناصر المساندة.\n- عند الاستعانة بموقع Flaticon تُختار الأيقونات من مجموعة خطية واحدة، ولا تُخلَط أساليب مختلفة في التصميم الواحد.\n\n### 3. الرسوم البيانية (Infographics)\n- يمكن الاستعانة بقوالب جاهزة مثل قوالب موقع Freepik لعرض الأفكار المقسّمة إلى نقاط (مثل قالب من 3 عناصر).\n- يُعاد تلوين القالب بألوان الهوية وخطوطها قبل استخدامه.\n\n## خامسًا: الضوابط الخاصة بتصوير الشخصيات\n### 1. صور المشايخ\n- يُصَفُّ المشايخ بمحاذاة واحدة، إلا إذا كان بينهم من يُقدَّم لفضله فيُقدَّم.\n- تُعتمَد صور المشايخ منهم قبل النشر.\n\n### 2. صور الأطفال\n- ألا تكون الثياب أكبر من سنّ الطفل.\n- أن تظهر البراءة والعفة في ملابسهم.\n- التنويع بين ألوان البشرة، وعدم الاكتفاء بالبشرة الفاتحة.\n\n### 3. صور النساء\n- لباس فضفاض مُسبَل لا يُحدِّد الجسم ولا منطقة الكتفين.\n- لون غير مبهرج ولا برّاق، ويُنوَّع بين الألوان الغامقة كالأسود والبني الغامق والكحلي الغامق.\n- نقاب يغطي الوجه، بفتحة عينين ضيقة تغطي الوجه كله تقريبًا.\n- الأيدي مغطاة.\n- يُفضَّل أن تظهر المرأة من الخلف أو الجانب، في أجواء منزلية أو تعليمية هادئة.\n\n## سادسًا: مراجعة المحتوى\n- المراجعة الشرعية: يراجع المحتوى مختصون في العلم الشرعي لضمان الدقة والالتزام بالضوابط.\n- المراجعة اللغوية: يراجعه مختصون في اللغة لضبط الصياغة والإملاء وعلامات الترقيم.\n\n## سابعًا: المعايير التقنية للمصمم (Photoshop / Illustrator)\n- الأبعاد والدقة: المقاس القياسي لمنشورات التواصل 1080 × 1080 بكسل بدقة 72، ودقة 300 للمطبوعات فقط مع استخدام قيم CMYK المعتمدة.\n- الخطوط: تثبيت Alexandria وSomar Sans من حقيبة الهوية قبل فتح ملفات التصميم.\n- تسريع الإنتاج: البدء من القوالب المعتمدة بدل البدء من الصفر، ونسخ العناصر الثابتة (الشعار، النقشة) من حقيبة الهوية.\n- نعومة الخطوط: ضبط إعداد الخط في الفوتوشوب على Sharp بدل Smooth لتفادي ظهور النص باهتًا أو مكسّرًا.\n- قناع الطبقة (Mask): لإخفاء أجزاء الصور أو الزخارف دون إتلاف الأصل، ليسهل التعديل لاحقًا.\n- المحاذاة: تفعيل الاختيار التلقائي (Auto-Select)، واستخدام أدوات المحاذاة (Alignment) لضمان توسيط العناصر بدقة.\n\n## معايير منشورات مسابقات العمرة\nيضبط هذا القسم جودة منشورات مسابقات العمرة، ويؤكد توافقها مع هوية الأكاديمية وتوجّهها لعام 2026.\n\n### أولًا: التصميم البصري\n- وضوح المشهد: يظهر الحرم المكي الشريف والكعبة المشرفة بصورة واقعية عالية الجودة، ويُمنع استخدام الصور التخيلية أو المعالجة بمبالغة أو المولّدة بالذكاء الاصطناعي حفاظًا على هيبة المكان وقدسيته.\n- العنصر البشري: يُفضَّل تضمينه لإضفاء بُعد عاطفي وروحاني، متمثلًا في امرأة مسلمة بلباس محتشم (خمار أو نقاب) متوافق مع الشريحة المستهدفة، تظهر من الخلف أو الجانب وهي تتأمل الكعبة أو تجلس في الحرم بوقار.\n- الهوية البصرية: الالتزام التام بألوان الأكاديمية وخطوطها، والبساطة (Minimalistic Design) دون ازدحام.\n- إبراز الجائزة: تكون «جائزة العمرة» العنصر الأبرز في التصميم.\n\n### ثانيًا: النص المرافق\n- الافتتاحية الجاذبة (Hook): جملة قصيرة مشوّقة تخاطب الشريحة المستهدفة بصيغة المؤنث، مثل: «هديةٌ قد تكون من نصيبكِ!» أو «هل تتمنّين زيارة بيت الله الحرام؟ فرصةٌ لا تُفوَّت…»\n- آلية المشاركة: خطوات الدخول في السحب في نقاط مباشرة مرتبة مختصرة، مع الشروط الأساسية، وإحالة إلى رابط الشروط التفصيلية بدل إطالة النص.\n\n## قائمة التحقق قبل النشر\n- [ ] الألوان من جدول الهوية فقط، والتدرج بين درجتين متقاربتين\n- [ ] العناوين بخط Alexandria والنصوص بخط Somar Sans\n- [ ] الشعار بالنسخة المناسبة للخلفية، دون تعديل، وحوله مساحة الأمان\n- [ ] النقشة بشفافية 5–10%، وصورة الخلفية بشفافية 10–15%\n- [ ] التسلسل واضح: عنوان، ثم عنوان ثانوي، ثم تفاصيل مختصرة\n- [ ] التباين كافٍ ولا تداخل بين النص والصور\n- [ ] الأيقونات خطية من مجموعة واحدة\n- [ ] الصور مطابقة لضوابط الشخصيات واللباس\n- [ ] تمت المراجعة الشرعية واللغوية\n- [ ] المقاس والدقة صحيحان (1080 × 1080 بدقة 72 للتواصل، و300 للمطبوعات)","gradients":[{"angle":135,"from":"#011A4A","name":"تدرج الكحلي الرئيسي","to":"#023373","use":""},{"angle":135,"from":"#023373","name":"تدرج الكحلي الواسع","to":"#1A5FA3","use":""},{"angle":135,"from":"#F280AA","name":"تدرج الوردي","to":"#FDB5C8","use":""},{"angle":135,"from":"#F280AA","name":"وردي داكن","to":"#FC739F","use":""},{"angle":135,"from":"#38B5DA","name":"تدرج فاتح","to":"#F2EFE2","use":""}],"kind":"master","name":"أكاديمية هندسة الأجيال","nameEn":"","order":0,"prompt":"وصف مرجعي لتوليد الصور أو البحث عنها:\nviewed from behind · no face visible · loose non-form-fitting clothing · hands covered · soft natural lighting · cool tones","rules":{"digital":"- الحد الأدنى للشعار 30px على الشاشات.\n- اترك حول الشعار مساحة آمنة خالية تماماً من العناصر والنصوص.\n- شعار الجهة أعلى اليسار دائماً بحجم ثابت لا يُصغّر عن 30px.\n- هامش آمن 5% من كل جانب لا يوضع فيه محتوى أساسي.\n- الصورة لا تتجاوز 60% من مساحة التصميم.\n- الزخرفة والباترن بشفافية 5% إلى 10% 07F · 500 #F27292 ★ · 400 #F693AC · 300 #F9B5C6 · 200 #FCD3DD · 100 #FDECF1.","donts":"تدوير الشعار بأي زاوية\nتمديد الشعار أو ضغط نسبه\nتغيير أي لون من ألوان الشعار\nإضافة ظل أو توهج أو Stroke للشعار\nوضع الشعار على خلفية مزدحمة مشابهة لألوانه\nتصغير الشعار عن 30px رقمياً / 20mm مطبوعاً\nإظهار الوجه بأي وضوح تام\nنقاب بفتحة واسعة — ضيقة جداً فقط\nأيادٍ مكشوفة — تُغطّى دائماً\nملابس ضيقة أو ألوان براقة مبهرجة\nمحتوى مختلط بين الجنسين\nصور Stock مصطنعة أو غربية الطابع\nثياب أطفال أكبر من سنّهم","dos":"الملوّن الكامل على الخلفيات الفاتحة: الأبيض، الكريمي، الرمادي الفاتح — الحالة الافتراضية\nالمعكوس أو الأبيض على الخلفيات الداكنة حصراً: الكحلي، الوردي الداكن\nالشعار داخل مربع كحلي على الصور والخلفيات المعقدة\nالكحلي أساس بصري للعناوين والخلفيات القوية، والوردي لتوجيه الانتباه والكلمات المفتاحية\nالبساطة والوضوح والاتزان البصري، وإبراز المحتوى قبل الزخرفة\nالالتزام بالمساحات البيضاء، وأيقونات بنفس الأسلوب البصري\nصور محتشمة تعبّر عن الأسرة والتربية والحوار بإضاءة طبيعية ودرجات باردة\nالصور: زوايا خلفية كاملة أو جانبية غير مباشرة، اليدان مغطّاتان تحملان كتاباً، بيئة طبيعية أو منزلية\nألوان الملابس: درجات داكنة هادئة مع تقليل الأسود — #3B2A24، #3A3D44، #4A5A70، #4B3558، #2F4A3A، #1F2E4A","print":"- الحد الأدنى لعرض الشعار 20mm في المطبوعات.\n- الكحلي الكامل على الأبيض فقط، للمراسلات الرسمية والطباعة أحادية اللون.\n- قيم CMYK هنا محسوبة تقريبياً من HEX؛ اعتمد قيمة المطبعة عند توفرها.\n- التسلسل: Alexandria ExtraBold 28–120pt للعناوين الرئيسية · Alexandria SemiBold 18–26pt لعناوين الأقسام والبرامج والجلسات · Somar Sans Regular 12–22pt للنصوص · Somar Sans Light 8–12pt للحواشي والتواريخ ومعلومات التواصل.","voice":"يجب أن يشعر المتلقي أن التصميم تابع لهندسة الأجيال قبل أن يقرأ الاسم.\nالطابع تربوي واستشاري دافئ، والخطاب بصيغة المؤنث.\nعبارة مرجعية: «نُصغي لنفهم، ونحاور لنبني أجيالًا واعية».\nالموقع: ajacadd.com"},"summary":"فريق الاستشارات الأسرية والتربوية في الأكاديمية. الشعار سقف بيت كحلي تتحاور تحته فقاعتان متشابكتان: الإصغاء (الكحلية) والإجابة (الوردية)، تعبيراً عن استشار function renderNav(){
  const r = route(), cur = r.view === "brand" ? r.id : r.view;
  const item = (href, label, on, color) => `<a class="nav-i ${on?"on":""}" href="${href}">${color!==undefined?`<i style="${color?`background:${color}`:""}"></i>`:""}<span class="t">${esc(label)}</span></a>`;
  const m = master();
  let h = item("#home","الرئيسية",cur==="home");
  if(m) h += item("#b-"+m.id,"الهوية الأم",cur===m.id,primaryOf(m)||"");
  for(const k of KIND_ORDER){
    const sc = SECT[k]; const list = S.brands.filter(b=>b.kind===k);
    h += `<div class="nav-h"><a href="#${sc.hash}">${sc.title}</a><span class="mono">${list.length}</span></div>`;
    h += list.length ? list.map(b=>item("#b-"+b.id,b.name,cur===b.id,primaryOf(b)||"")).join("") : `<div class="nav-empty">${sc.empty}</div>`;
    if(window.innerWidth <= 900) h += item("#"+sc.hash,sc.title,cur===sc.hash);
  }
  h += `<div class="nav-sep" role="separator"></div>` + item("#rules","ضوابط تصميمات الأكاديمية",cur==="rules");
  $("#nav").innerHTML = h;
  $("#sidefoot").innerHTML = S.canEdit
    ? `<button class="btn primary" data-act="new-brand" data-kind="program">+ برنامج جديد</button><button class="btn" data-act="new-brand" data-kind="diploma">+ دفعة دبلوم</button><button class="btn" data-act="new-brand" data-kind="project">+ مشروع أو فريق</button><button class="btn" data-act="new-brand" data-kind="product">+ منتج جديد</button><span class="who">لديك صلاحية التعديل والرفع.</span>`
    : OFF ? `<span class="who">نسخة محفوظة بتاريخ ${esc(fmtDate(OFF.exportedAt))} — للعرض والتحميل فقط. أحدث نسخة على موقع المكتبة.</span>`
    : (S.loaded ? `<span class="who">وضع العرض: يمكنك التحميل والنسخ. لإضافة ملفات اطلب صلاحية محرّر.</span>` : "");
}

function stateNotice(){
  if(S.dbState === "nodb") return `<div class="notice">المكتبة متاحة لأعضاء الفريق المسجّلين. سجّل الدخول إلى Claude لعرض الهويات والملفات.</div>`;
  if(S.dbState === "error") return `<div class="notice">تعذّر تحميل المكتبة. أعد فتح الصفحة لاحقًا.</div>`;
  if(S.dbState === "slow" && !S.brands.length) return `<div class="notice">لم نتمكن من الوصول إلى البيانات حتى الآن. تحقّق من الاتصال، وستظهر الهويات تلقائيًا عند توفرها.</div>`;
  if(!S.loaded && !S.brands.length) return `<div class="notice">جارٍ تحميل المكتبة…</div>`;
  return "";
}

function renderMain(){
  const r = route(); const el = $("#main");
  const note = stateNotice();
  if(note && !S.brands.length){ el.innerHTML = note; return; }
  if(r.view === "brand"){
    const b = byId(r.id);
    if(!b){ el.innerHTML = S.loaded ? `<div class="empty"><b>هذه الهوية غير موجودة</b><span>ربما حُذفت أو تغيّر رابطها.</span><a class="btn" href="#home">العودة للرئيسية</a></div>` : `<div class="notice">جارٍ التحميل…</div>`; return; }
    ensureFiles(b.id); el.innerHTML = brandView(b); return;
  }
  ensureFiles(null);
  if(r.view === "rules"){ el.innerHTML = rulesView(); return; }
  const lk = KIND_ORDER.find(k => SECT[k].hash === r.view);
  el.innerHTML = lk ? listView(lk) : homeView();
}

function matchQ(b){ const q = S.q.trim(); if(!q) return true; return [b.name,b.nameEn,b.summary].join(" ").toLowerCase().includes(q.toLowerCase()); }

function card(b, wide){
  const c = primaryOf(b) || "var(--line)";
  const art = b.coverAsset ? `<img src="${blobUrl(b.coverAsset)}" alt="شعار ${esc(b.name)}" loading="lazy">` : `<span class="mono-init">${esc(initials(b.name))}</span>`;
  const dots = (b.colors||[]).map(x=>hexNorm(x.hex)).filter(Boolean).slice(0,7).map(h=>`<span style="background:${h}" title="${h}"></span>`).join("");
  return `<a class="card ${wide?"wide":""}" href="#b-${esc(b.id)}" style="--c:${c}">
    <div class="card-art">${art}</div>
    <div class="card-body"><span class="kind">${KIND[b.kind]||""}</span><h3>${esc(b.name)}</h3>${b.summary?`<p>${esc(b.summary)}</p>`:""}${dots?`<div class="dots">${dots}</div>`:""}</div></a>`;
}

function homeView(){
  const m = master();
  const counts = KIND_ORDER.map(k => `<span><b class="mono">${S.brands.filter(b=>b.kind===k).length}</b> ${SECT[k].title}</span>`).join("");
  let h = `<header class="hero">
    <div class="hero-txt"><span class="eyebrow">مرجع فريق التصميم</span><h1>كل ما يحتاجه المصمم قبل أن يبدأ</h1>
      <p>الشعارات والخطوط والألوان والضوابط وبرومبت الهوية لأكاديمية هندسة الأجيال وبرامجها ومشاريعها ومنتجاتها، في مكان واحد.</p>
      <div class="hero-stats">${counts}</div></div>
    <div class="hero-mark"><img src="${blobUrl(SITE.logoSlogan)}" alt="أكاديمية هندسة الأجيال — لأن الأم تصنع الأمة" onerror="this.remove()"></div></header>`;
  if(S.q.trim()) h += `<p class="hint">نتائج البحث عن «${esc(S.q)}»</p>`;
  if(m && matchQ(m)) h += `<section><div class="sec-h"><h2>الهوية الأم</h2></div>${card(m,true)}</section>`;
  else if(!m && S.loaded && !S.q.trim()) h += `<div class="empty"><b>لم تُضف الهوية الأم بعد</b><span>ابدأ بها، فالبرامج والمشاريع والمنتجات تُبنى عليها.</span>${S.canEdit?`<button class="btn primary" data-act="new-brand" data-kind="master">إنشاء الهوية الأم</button>`:""}</div>`;
  for(const k of KIND_ORDER) h += listSection(k, S.brands.filter(b=>b.kind===k&&matchQ(b)), 6);
  if(!S.q.trim()) h += `<section><a class="rules-link" href="#rules"><span class="rl-t">ضوابط تصميمات الأكاديمية</span><span class="rl-d">الضوابط العامة التي تسري على كل البرامج والمشاريع والمنتجات: الألوان، والخطوط، والصور، والمراجعة، وقائمة التحقق قبل النشر.</span><span class="rl-a">فتح الصفحة ←</span></a></section>`;
  return h;
}
function listSection(kind, items, cap){
  const sc = SECT[kind];
  const add = S.canEdit ? `<button class="btn sm" data-act="new-brand" data-kind="${kind}">+ ${sc.one}</button>` : "";
  let body;
  if(!items.length) body = `<div class="empty"><b>${S.q.trim()?"لا نتائج مطابقة":sc.empty}</b>${!S.q.trim()?`<span>${sc.hint}</span>`:""}${S.canEdit&&!S.q.trim()?add:""}</div>`;
  else body = `<div class="grid">${(cap?items.slice(0,cap):items).map(b=>card(b)).join("")}</div>`;
  const more = cap && items.length > cap ? `<a class="btn sm ghost" href="#${sc.hash}">عرض الكل (${items.length})</a>` : "";
  return `<section><div class="sec-h"><h2>${sc.title} <span class="count">${items.length}</span></h2><div class="row">${more}${items.length?add:""}</div></div>${body}</section>`;
}
function listView(kind){
  const items = S.brands.filter(b=>b.kind===kind&&matchQ(b));
  const m = master(); const sc = SECT[kind];
  return `<div class="intro"><div><span class="eyebrow">${sc.eyebrow}</span><h1>${sc.title}</h1><p>${sc.intro}${m?` <a href="#b-${m.id}">مراجعة الهوية الأم</a>`:""}</p></div></div>` + listSection(kind, items, 0);
}

/* brand sheet */
function brandView(b){
  const p = primaryOf(b) || primaryOf(master()) || "#003375"; const on = onColor(p);
  const fontIds = fontMatchedIds(b);
  const logos = S.files.filter(f=>f.category==="logo"); const others = S.files.filter(f=>f.category!=="logo" && !fontIds.has(f.id));
  const m = master(); const isM = b.kind === "master";
  const art = b.coverAsset ? `<img src="${blobUrl(b.coverAsset)}" alt="شعار ${esc(b.name)}">` : `<span class="mono-init">${esc(initials(b.name))}</span>`;
  const ed = S.canEdit;
  let h = `<header class="band" style="--band:${p};--on:${on}" ${on!=="#FFFFFF"?"data-light":""}>
    <div class="band-logo">${art}</div>
    <div><span class="kind">${KIND[b.kind]||""}</span><h1>${esc(b.name)}</h1>${b.nameEn?`<p class="en" dir="ltr" style="text-align:right">${esc(b.nameEn)}</p>`:""}${b.summary?`<p class="sum">${esc(b.summary)}</p>`:""}
      <div class="band-actions">${b.driveFolder?`<a class="btn sm" href="${esc(b.driveFolder)}" target="_blank" rel="noopener">مجلد الملفات على درايف ↗</a>`:""}<button class="btn sm" data-act="jump" data-to="sec-prompt">برومبت الهوية</button>${ed?`<button class="btn sm" data-act="edit-info">تعديل البيانات</button>`:""}</div>
      ${b.updatedAt?`<div class="band-meta">آخر تحديث: ${fmtDate(b.updatedAt)}</div>`:""}
    </div></header>`;
  if(!isM && m) h += `<div class="parent-note"><span class="kind">${b.kind==="project"?"بإشراف":"مشتقة من"}</span><a href="#b-${m.id}">${esc(m.name)}</a><span>راجع الهوية الأم قبل أي تعديل على الألوان أو الخطوط.</span></div>`;
  h += `<nav class="subnav" aria-label="أقسام الهوية">${[["sec-logos","الشعارات"],["sec-colors","الألوان"],...(gradsOf(b).length?[["sec-grads","التدرجات"]]:[]),["sec-fonts","الخطوط"],["sec-files","الملفات والعناصر"],["sec-rules","الضوابط"],...(master()?.generalRules?[["sec-general","الضوابط العامة"]]:[]),["sec-prompt","البرومبت"],["sec-downloads","التحميلات"]].map(([id,l])=>`<button data-act="jump" data-to="${id}">${l}</button>`).join("")}</nav>`;

  /* logos */
  h += `<section id="sec-logos"><div class="sec-h"><h2>الشعارات <span class="count">${logos.length}</span></h2>${ed?`<button class="btn sm primary" data-act="add-file" data-cat="logo">+ رفع شعارات</button>`:""}</div>`;
  if(!S.filesLoaded && S.filesFor===b.id) h += `<p class="hint">جارٍ تحميل الملفات…</p>`;
  else if(!logos.length) h += `<div class="empty"><b>لا توجد شعارات بعد</b><span>ارفع كل نسخة على حدة (أفقي، عمودي، أيقونة، أبيض، أسود…) بصيغة SVG أو PNG شفاف لتتمكن من تصديرها بأي حجم.</span>${ed?`<button class="btn primary" data-act="add-file" data-cat="logo">رفع شعارات</button>`:""}</div>`;
  else h += `<div class="tiles">${logos.map(f=>logoTile(b,f)).join("")}</div>`;
  h += `</section>`;

  /* colors */
  const cols = (b.colors||[]).map(c=>({c,k:codesOf(c)})).filter(x=>x.k);
  h += `<section id="sec-colors"><div class="sec-h"><h2>الألوان <span class="count">${cols.length}</span></h2><div class="row">${cols.length?`<button class="btn sm" data-act="copy-css">نسخ كمتغيرات CSS</button><button class="btn sm" data-act="copy-hexes">نسخ كل الأكواد</button>`:""}${ed?`<button class="btn sm primary" data-act="edit-colors">تعديل الألوان</button>`:""}</div></div>`;
  if(!cols.length) h += `<div class="empty"><b>لم تُحدَّد ألوان بعد</b><span>أضف الألوان بأكواد HEX، وسيُحسب RGB وCMYK وHSL تلقائيًا.</span>${ed?`<button class="btn primary" data-act="edit-colors">إضافة الألوان</button>`:""}</div>`;
  else h += `<div class="palette-strip" aria-hidden="true">${cols.map(x=>`<span style="background:${x.k.hex}"></span>`).join("")}</div><div class="swatches">${cols.map(({c,k})=>swatch(c,k)).join("")}</div>`;
  h += `</section>`;

  /* gradients */
  const grads = gradsOf(b);
  if(grads.length || ed){
    h += `<section id="sec-grads"><div class="sec-h"><h2>التدرجات اللونية <span class="count">${grads.length}</span></h2>${ed?`<button class="btn sm primary" data-act="edit-grads">تعديل التدرجات</button>`:""}</div>`;
    if(!grads.length) h += `<div class="empty"><b>لا توجد تدرجات بعد</b><span>أضف التدرجات المعتمدة بلونَي البداية والنهاية والزاوية، لينسخها الفريق ككود CSS أو يحمّلها كخلفية SVG.</span><button class="btn primary" data-act="edit-grads">إضافة تدرج</button></div>`;
    else h += `<div class="grads">${grads.map((g,i)=>gradRow(g,i)).join("")}</div>`;
    h += `</section>`;
  }

  /* fonts */
  const fonts = b.fonts||[];
  h += `<section id="sec-fonts"><div class="sec-h"><h2>الخطوط <span class="count">${fonts.length}</span></h2>${ed?`<button class="btn sm primary" data-act="edit-fonts">تعديل الخطوط</button>`:""}</div>`;
  if(!fonts.length) h += `<div class="empty"><b>لم تُضف خطوط بعد</b><span>ارفع ملف الخط (TTF أو OTF أو WOFF) لتظهر معاينته هنا ويحمّله الفريق، أو أضف رابط درايف لحزمة الخط كاملة.</span>${ed?`<button class="btn primary" data-act="edit-fonts">إضافة خط</button>`:""}</div>`;
  else h += `<div class="fonts">${fonts.map((f,i)=>fontCard(f,i)).join("")}</div>`;
  h += `</section>`;

  /* files */
  const cats = [...new Set(others.map(f=>f.category))];
  if(S.fileFilter !== "all" && !cats.includes(S.fileFilter)) S.fileFilter = "all";
  const shown = others.filter(f => S.fileFilter==="all" || f.category===S.fileFilter);
  h += `<section id="sec-files"><div class="sec-h"><h2>الملفات والعناصر <span class="count">${others.length}</span></h2>${ed?`<button class="btn sm primary" data-act="add-file" data-cat="element">+ إضافة ملف</button>`:""}</div>`;
  if(!others.length) h += `<div class="empty"><b>لا توجد ملفات بعد</b><span>العناصر الجرافيكية، الأنماط، القوالب، دليل الهوية PDF، والملفات المصدرية (AI وPSD) عبر روابط درايف.</span>${ed?`<button class="btn primary" data-act="add-file" data-cat="element">إضافة ملف</button>`:""}</div>`;
  else {
    if(cats.length > 1) h += `<div class="filters"><button class="${S.fileFilter==="all"?"on":""}" data-act="filter" data-cat="all">الكل</button>${cats.map(c=>`<button class="${S.fileFilter===c?"on":""}" data-act="filter" data-cat="${c}">${CATS[c]||c}</button>`).join("")}</div>`;
    h += `<div class="flist">${shown.map(f=>fileRow(b,f)).join("")}</div>`;
  }
  h += `</section>`;

  /* rules */
  const R = b.rules||{};
  const hasRules = ["digital","print","dos","donts","voice"].some(k=>String(R[k]||"").trim());
  h += `<section id="sec-rules"><div class="sec-h"><h2>ضوابط التصميم والإنتاج</h2>${ed?`<button class="btn sm primary" data-act="edit-rules">تعديل الضوابط</button>`:""}</div>`;
  if(!hasRules) h += `<div class="empty"><b>لم تُكتب الضوابط بعد</b><span>مساحات الحماية حول الشعار، الحد الأدنى للحجم، المقاسات الرقمية، مواصفات الطباعة، وما يُسمح وما لا يُسمح.</span>${ed?`<button class="btn primary" data-act="edit-rules">كتابة الضوابط</button>`:""}</div>`;
  else {
    const block = (cls,t,v,list) => String(v||"").trim() ? `<div class="rule ${cls}"><h3>${t}</h3>${list?`<ul>${lines(v).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="txt">${esc(v)}</p>`}</div>` : "";
    h += `<div class="rules">${block("","الإنتاج الرقمي",R.digital)}${block("","الإنتاج المطبوع",R.print)}${block("do","افعل",R.dos,true)}${block("dont","لا تفعل",R.donts,true)}${block("","نبرة الخطاب والكتابة",R.voice)}</div>`;
  }
  h += `</section>`;

  /* academy-wide general rules: written on the parent identity, shown on every identity */
  const GR = String(m?.generalRules || "").trim();
  if(GR || (isM && ed)){
    h += `<section id="sec-general"><a class="rules-link" href="#rules"><span class="rl-t">ضوابط تصميمات الأكاديمية</span><span class="rl-d">${GR?"ضوابط عامة تسري على كل البرامج والمشاريع والمنتجات، إلى جانب ضوابط هذه الهوية. وهي مضمّنة في برومبت هذه الهوية.":"لم تُكتب بعد. افتح الصفحة لإضافتها."}</span><span class="rl-a">فتح الصفحة ←</span></a></section>`;
  }

  /* prompt */
  const view = S.promptView || (b.promptFinal ? "final" : "auto");
  const text = view === "ai" ? (S.aiDraft ?? "") : view === "final" ? (b.promptFinal||"") : buildPrompt(b);
  h += `<section id="sec-prompt"><div class="sec-h"><h2>برومبت الهوية</h2><span class="hint">يُرفق قبل بدء أي مشروع، مع مصمم أو مع أداة ذكاء اصطناعي.</span></div>
    <div class="prompt-box"><div class="prompt-bar"><div class="tabs">
      ${b.promptFinal?`<button class="${view==="final"?"on":""}" data-act="prompt-view" data-v="final">المعتمد</button>`:""}
      <button class="${view==="auto"?"on":""}" data-act="prompt-view" data-v="auto">مُولَّد من بيانات الهوية</button>
      ${S.aiDraft!==null?`<button class="${view==="ai"?"on":""}" data-act="prompt-view" data-v="ai">صياغة Claude</button>`:""}
    </div><div class="row">
      <button class="btn sm primary" data-act="copy-prompt">نسخ البرومبت</button>
      ${S.sample?`<button class="btn sm" data-act="ai-prompt" ${S.aiBusy?"disabled":""}>${S.aiBusy?"جارٍ الصياغة…":"صياغة احترافية بواسطة Claude"}</button>`:""}
      ${ed&&view==="ai"&&S.aiDraft&&!S.aiBusy?`<button class="btn sm" data-act="approve-ai">اعتماد هذه الصياغة</button>`:""}
      ${ed?`<button class="btn sm" data-act="edit-prompt">تعديل</button>`:""}
    </div></div><pre id="promptText">${esc(text)}</pre></div></section>`;

  /* download packs */
  const fontCount = (b.fonts||[]).filter(f => familyFiles(f, S.files).length).length;
  const packs = [
    ["all", "الهوية كاملة", "كل الشعارات والخطوط والألوان والتدرجات والملفات والبرومبت في ملف واحد مرتّب في مجلدات", "ZIP", true],
    ["logos", "الشعارات", `${logos.length} ملف بصيغها الأصلية`, "ZIP", logos.length],
    ["fonts", "الخطوط", `${fontCount} ${fontCount===1?"عائلة":"عائلات"}، كل عائلة في مجلد`, "ZIP", fontCount],
    ["colors", "الألوان", `${cols.length} لون: CSS وJSON ونص بأكواد HEX/RGB/CMYK ولوحة SVG`, "ZIP", cols.length],
    ["grads", "التدرجات", `${grads.length} تدرج: خلفيات SVG وكود CSS`, "ZIP", grads.length],
    ["files", "الملفات والعناصر", `${others.length} ملف${others.some(f=>f.driveUrl)?"، وروابط درايف في ملف نصي":""}`, "ZIP", others.length],
    ["brief", "الضوابط والبرومبت", "ملف Markdown بالنبذة والضوابط وبرومبت الهوية", "MD", true]];
  h += `<section id="sec-downloads"><div class="sec-h"><h2>تحميل حزم الهوية</h2><span class="hint">كل جزء في ملف واحد جاهز.</span></div>
    ${S.downloads ? `<div class="packs">${packs.map(([k,t,d,fmt,on]) => `<button class="pack ${k==="all"?"main":""}" data-act="pack" data-k="${k}" ${on?"":"disabled"}><span class="pk-t">${t}</span><span class="pk-d">${on?d:"لا يوجد محتوى بعد"}</span><span class="pk-f">${fmt} ⭳</span></button>`).join("")}</div>` : `<div class="notice">التحميل غير متاح في هذا العرض. افتح المكتبة من claude.ai لتحميل الحزم.</div>`}</section>`;
  return h;
}

function dlControl(f, name, label){
  if(f.driveUrl) return `<a class="btn sm" href="${esc(f.driveUrl)}" target="_blank" rel="noopener">فتح في درايف ↗</a>`;
  if(!f.assetId) return "";
  const ext = f.ext || extOf(f.filename);
  if(S.downloads) return `<button class="btn sm" data-act="dl" data-id="${esc(f.id)}">${label||"تحميل"}${SAVE_EXT.has(ext)?"":" (ZIP)"}</button>`;
  return `<a class="btn sm" href="${blobUrl(f.assetId)}" target="_blank" rel="noopener">فتح الملف ↗</a>`;
}
const isImg = f => f.assetId && /^image\//.test(f.contentType||"");

function logoTile(b,f){
  const bg = S.tileBg[f.id] || "checker";
  const ext = (f.ext || extOf(f.filename) || "").toUpperCase();
  const art = isImg(f) ? `<img src="${blobUrl(f.assetId)}" alt="${esc(f.title)}" loading="lazy">` : `<span class="ext-label">${esc(ext||"FILE")}</span>`;
  let menu = "";

/* gradients */
const gradsOf = b => (b?.gradients||[]).filter(g => hexNorm(g.from) && hexNorm(g.to));
const gradAngle = g => { const a = parseInt(g.angle,10); return isNaN(a) ? 135 : ((a%360)+360)%360; };
const gradCss = g => `linear-gradient(${gradAngle(g)}deg, ${hexNorm(g.from)} 0%, ${hexNorm(g.to)} 100%)`;
function gradSvg(g, w=1920, h=1080){
  const a = gradAngle(g)*Math.PI/180, s = Math.sin(a)/2, c = Math.cos(a)/2, r = n => n.toFixed(4);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="${r(.5-s)}" y1="${r(.5+c)}" x2="${r(.5+s)}" y2="${r(.5-c)}"><stop offset="0" stop-color="${hexNorm(g.from)}"/><stop offset="1" stop-color="${hexNorm(g.to)}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/></svg>`;
}

    <div class="row"><button class="btn sm" data-act="copy" data-text="${esc("background: "+css+";")}" data-label="كود CSS">نسخ CSS</button>${S.downloads?`<button class="btn sm ghost" data-act="dl-grad" data-i="${i}">تحميل SVG</button>`:""}</div></div>`;
}
function editGradients(b){

      <span class="gpair"><input type="color" data-f="toPick" value="${(hexNorm(g.to)||"#000000").toLowerCase()}" aria-label="لون النهاية"><input data-f="to" dir="ltr" class="mono" value="${esc(g.to||"")}" placeholder="#023373" aria-label="HEX النهاية"></span>
      <input data-f="angle" type="number" dir="ltr" min="0" max="360" value="${esc(g.angle ?? 135)}" aria-label="الزاوية بالدرجات" title="الزاوية بالدرجات">
      <div class="row-tools"><button class="icon-btn" data-m="up" aria-label="تحريك لأعلى">↑</button><button class="icon-btn" data-m="down" aria-label="تحريك لأسفل">↓</button><button class="icon-btn" data-m="del" aria-label="حذف">✕</button></div></div>`).join("") : `<p class="hint">لا توجد تدرجات بعد.</p>`;
  };
  modal({title:"تدرجات " + b.name, wide:true,

    onOpen: w => {
      draw(w);
      w.addEventListener("input", e => { const r = e.target.closest(".ed-row"); if(!r) return; const i = +r.dataset.i, f = e.target.dataset.f; if(!f) return;
        if(f === "fromPick" || f === "toPick"){ const k = f.replace("Pick",""); rows[i][k] = e.target.value.toUpperCase(); r.querySelector(`[data-f=${k}]`).value = rows[i][k]; }

        const g = rows[i]; if(hexNorm(g.from) && hexNorm(g.to)) r.querySelector(".gprev").style.background = gradCss(g); });
      w.addEventListener("click", e => { const t = e.target.closest("[data-m]"); if(!t) return; const r = t.closest(".ed-row"); const i = r ? +r.dataset.i : -1; const m = t.dataset.m;
        if(m === "add"){ const c = (b.colors||[]).map(x=>hexNorm(x.hex)).filter(Boolean); rows.push({name:"", use:"", from:c[0]||"#003375", to:c[1]||"#F280AA", angle:135}); }
        if(m === "del") rows.splice(i,1);

      const out = rows.map(g => ({name:String(g.name||"").trim(), use:String(g.use||"").trim(), from:hexNorm(g.from), to:hexNorm(g.to), angle:gradAngle(g)}));

    }});
}

/* font families: files whose name starts with the family name belong to that family */
const famKey = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const WEIGHT_ORDER = ["thin","extralight","light","regular","book","medium","semibold","bold","extrabold","black","heavy"];
const weightOf = name => { const k = famKey(String(name).replace(/\.[^.]+$/,"")); let best = ""; for(const w of WEIGHT_ORDER) if(k.endsWith(w) && w.length > best.length) best = w; return best; };
function familyFiles(f, files){
  const k = famKey(f.name); if(!k) return [];
  const out = files.filter(x => x.category === "font" && x.assetId && (famKey(x.filename).startsWith(k) || famKey(x.title).startsWith(k)));
  if(f.assetId && !out.some(x => x.assetId === f.assetId)) out.push({assetId:f.assetId, filename:f.filename || (k+".otf"), title:f.name, linked:true});
  return out.sort((a,b) => WEIGHT_ORDER.indexOf(weightOf(a.filename)) - WEIGHT_ORDER.indexOf(weightOf(b.filename)));
}
function fontMatchedIds(b){ const ids = new Set(); (b.fonts||[]).forEach(f => familyFiles(f, S.files).forEach(x => x.id && ids.add(x.id))); return ids; }
/* gather a family's files: this identity first, then the same family uploaded under other identities */
async function collectFamily(b, f){
  let list = familyFiles(f, S.files);
  if(list.filter(x=>!x.linked).length === 0 && S.db){
    for(const o of S.brands){ if(o.id === b.id) continue;
      try { const snap = await S.db.collection("brands/"+o.id+"/files").where("category","==","font").get();
        familyFiles({name:f.name}, snap.docs.map(d => ({id:d.id, ...d.data()}))).forEach(x => { if(!list.some(y => y.filename === x.filename)) list.push(x); }); } catch {} }
  }
  const seen = new Set(); return list.filter(x => !seen.has(x.filename) && seen.add(x.filename));
}

function fontCard(f,i){
  const fam = familyFor(f);

  if(f.google && f.name) dl += `<a class="btn sm ghost" href="https://fonts.google.com/specimen/${encodeURIComponent(f.name.trim()).replace(/%20/g,"+")}" target="_blank" rel="noopener">Google Fonts ↗</a>`;
  const st = `font-family:'${esc(fam).replace(/'/g,"")}', var(--f-body)`;
  return `<div class="font"><div class="spec-ar" style="${st}">أكاديمية هندسة الأجيال ١٢٣</div><div class="spec-lt" style="${st}">Aa Bb Cc 0123456789</div>
    <div class="meta"><strong>${esc(f.name||"خط")}</strong>${f.role?`<span class="kind">${esc(f.role)}</span>`:""}</div>
    ${f.weights?`<p>الأوزان: <span dir="ltr">${esc(f.weights)}</span></p>`:""}${f.usage?`<p>${esc(f.usage)}</p>`:""}

    ${dl?`<div class="row">${dl}</div>`:""}
    <div class="row"><button class="btn sm ghost" data-act="copy" data-text="${esc(f.name||"")}" data-label="اسم الخط">نسخ اسم الخط</button><button class="btn sm ghost" data-act="copy" data-text="${esc(`font-family: '${f.name||""}', sans-serif;`)}" data-label="كود CSS">نسخ CSS</button></div></div>`;

/* ---------- ZIP packs ---------- */
const zipName = s => safeName(s).replace(/\s+/g," ");
const extFix = f => { const e = f.ext || extOf(f.filename); const n = f.filename || (f.title + "." + e); return extOf(n) ? n : n + "." + e; };
async function zipSave(name, build){
  if(!S.downloads){ toast("التحميل غير متاح في هذا العرض"); return; }
  if(!window.JSZip){ toast("أداة الضغط لم تُحمَّل. أعد فتح الصفحة ثم حاول مجددًا"); return; }
  toast("جارٍ تجهيز الملف…");
  try { const z = new JSZip(); await build(z); const blob = await z.generateAsync({type:"blob"}); await saveAs(name, blob); }
  catch(e){ console.error(e); toast("تعذّر تجهيز الملف"); }
}
async function addFiles(z, folder, files){
  const links = [];
  for(const f of files){
    if(f.assetId){ try { z.file((folder?folder+"/":"") + safeName(extFix(f)), await fetchBlob(f.assetId)); } catch { links.push(`${f.title||f.filename}: تعذّر جلب الملف`); } }
    else if(f.driveUrl) links.push(`${f.title||"ملف"}${f.ext?` (${f.ext.toUpperCase()})`:""}: ${f.driveUrl}`);
  }
  if(links.length) z.file((folder?folder+"/":"") + "روابط درايف.txt", links.join("\n"));
}
const colorsCss = b => ":root {\n" + (b.colors||[]).map((c,i)=>{ const h = hexNorm(c.hex); if(!h) return null; const n = (c.name||"").trim() ? c.name.trim().replace(/[\s·]+/g,"-") : "color-"+(i+1); return `  --${n}: ${h};`; }).filter(Boolean).join("\n") + "\n}\n";
const colorsTxt = b => (b.colors||[]).map(c => { const k = codesOf(c); return k ? `${c.name||"لون"}${c.role?` (${c.role})`:""}\nHEX ${k.hex} | RGB ${k.rgb} | CMYK ${k.cmyk}${k.pantone?` | Pantone ${k.pantone}`:""}` : null; }).filter(Boolean).join("\n\n") + "\n";
const colorsJson = b => JSON.stringify((b.colors||[]).map(c => { const k = codesOf(c); return k && {name:c.name||"", role:c.role||"", hex:k.hex, rgb:k.rgb, cmyk:k.cmyk, pantone:k.pantone||""}; }).filter(Boolean), null, 2);
function paletteSvg(b){
  const cs = (b.colors||[]).map(codesOf).filter(Boolean), W = 240, H = 260, cols = Math.min(5, cs.length||1), rows = Math.ceil(cs.length/cols);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${cols*W}" height="${rows*H}" viewBox="0 0 ${cols*W} ${rows*H}"><rect width="100%" height="100%" fill="#FFFFFF"/>` + cs.map((k,i) => { const x = (i%cols)*W, y = Math.floor(i/cols)*H, c = (b.colors||[]).filter(cc=>hexNorm(cc.hex))[i];
    return `<rect x="${x+10}" y="${y+10}" width="${W-20}" height="170" rx="12" fill="${k.hex}"/><text x="${x+20}" y="${y+205}" font-family="sans-serif" font-size="18" fill="#111">${esc(c.name||"")}</text><text x="${x+20}" y="${y+230}" font-family="monospace" font-size="16" fill="#555">${k.hex}  ·  CMYK ${esc(k.cmyk)}</text>`; }).join("") + `</svg>`;
}
const gradsCss = b => gradsOf(b).map((g,i) => `/* ${g.name||"تدرج "+(i+1)}${g.use?` — ${g.use}`:""} */\n.gradient-${i+1} { background: ${gradCss(g)}; }`).join("\n\n") + "\n";
function briefMd(b){
  const R = b.rules||{}, L = [`# ${b.name}${b.nameEn?` — ${b.nameEn}`:""}`, "", `**النوع:** ${KIND[b.kind]||""}`];
  if(b.summary) L.push("", "## نبذة", b.summary);
  const sec = (t,v,list) => { if(String(v||"").trim()) L.push("", "## "+t, list ? lines(v).map(x=>"- "+x).join("\n") : String(v).trim()); };
  sec("الإنتاج الرقمي", R.digital); sec("الإنتاج المطبوع", R.print); sec("افعل", R.dos, true); sec("لا تفعل", R.donts, true); sec("نبرة الخطاب والكتابة", R.voice);
  L.push("", "---", "", buildPrompt(b));
  if(b.promptFinal) L.push("", "---", "", "## البرومبت المعتمد", "", b.promptFinal);
  return L.join("\n") + "\n";
}
async function packZip(b, k){
  const base = zipName(b.name), logos = S.files.filter(f=>f.category==="logo"), fontIds = fontMatchedIds(b), others = S.files.filter(f=>f.category!=="logo" && !fontIds.has(f.id));
  const addFonts = async (z, root) => { for(const f of (b.fonts||[])){ const list = await collectFamily(b, f); if(list.length) await addFiles(z, root + zipName(f.name), list); else if(f.driveUrl) z.file(root + zipName(f.name) + "/رابط الخط.txt", f.driveUrl); } };
  const addColors = (z, root) => { z.file(root+"colors.css", colorsCss(b)); z.file(root+"colors.json", colorsJson(b)); z.file(root+"الألوان.txt", colorsTxt(b)); z.file(root+"palette.svg", paletteSvg(b)); };
  const addGrads = (z, root) => { gradsOf(b).forEach((g,i) => z.file(`${root}${String(i+1).padStart(2,"0")} ${zipName(g.name||"تدرج")}.svg`, gradSvg(g))); z.file(root+"gradients.css", gradsCss(b)); };
  if(k === "brief") return saveAs(`${base} - الضوابط والبرومبت.md`, briefMd(b));
  const titles = {all:"الهوية كاملة", logos:"الشعارات", fonts:"الخطوط", colors:"الألوان", grads:"التدرجات", files:"الملفات والعناصر"};
  await zipSave(`${base} - ${titles[k]}.zip`, async z => {
    if(k === "logos") await addFiles(z, "", logos);
    if(k === "fonts") await addFonts(z, "");
    if(k === "colors") addColors(z, "");
    if(k === "grads") addGrads(z, "");
    if(k === "files") await addFiles(z, "", others);
    if(k === "all"){
      await addFiles(z, "01 الشعارات", logos); addColors(z, "02 الألوان/");
      if(gradsOf(b).length) addGrads(z, "03 التدرجات/");
      await addFonts(z, "04 الخطوط/"); if(others.length) await addFiles(z, "05 الملفات والعناصر", others);
      z.file("06 الضوابط والبرومبت.md", briefMd(b));
      if(master()?.generalRules) z.file("07 الضوابط العامة للأكاديمية.md", generalMd());
    }
  });
}

/* prompt */
function colorLine(c){ const k = codesOf(c); if(!k) return null; return `- ${c.name||"لون"}${c.role?` (${c.role})`:""}: HEX ${k.hex} | RGB ${k.rgb} | CMYK ${k.cmyk}${k.pantone?` | Pantone ${k.pantone}`:""}`; }
function fontLine(f){ return `- ${f.name||"خط"}${f.role?` — يُستخدم في ${f.role}`:""}${f.weights?` — الأوزان: ${f.weights}`:""}${f.usage?` — ${f.usage}`:""}`; }
function buildPrompt(b){
  const m = master(); const isM = b.kind === "master"; const L = []; const R = b.rules||{};

  const gl = gradsOf(b); if(gl.length) L.push("", "## التدرجات اللونية", ...gl.map(g => `- ${g.name||"تدرج"}${g.use?` (${g.use})`:""}: ${gradCss(g)}`));
  if((b.fonts||[]).length) L.push("", "## الخطوط", ...b.fonts.map(fontLine));
  if(S.filesFor === b.id){ const lg = S.files.filter(f=>f.category==="logo"); if(lg.length) L.push("", "## نسخ الشعار المعتمدة", ...lg.map(f=>`- ${f.title||f.filename}${f.variant?` (${f.variant})`:""} — ${(f.ext||extOf(f.filename)).toUpperCase()}`)); }

  return L.join("\n");
}

/* ---------- data ---------- */
function subBrands(){
  const t = setTimeout(()=>{ if(!S.loaded){ S.dbState = "slow"; render(); } }, 10000);
  S.db.collection("brands").onSnapshot(snap => {
    S.brands = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(sortBrands);
    if(!snap.metadata.fromCache){ S.loaded = true; S.dbState = "ok"; clearTimeout(t); }
    render();
  }, e => { clearTimeout(t); S.loaded = true; S.dbState = "error"; render(); });
}
function ensureFiles(id){
  if(S.filesFor === id) return;
  if(S.filesUnsub){ S.filesUnsub(); S.filesUnsub = null; }
  S.files = []; S.filesLoaded = false; S.filesFor = id; S.fileFilter = "all";
  if(!S.db || !id) return;
  S.filesUnsub = S.db.collection("brands/" + id + "/files").onSnapshot(snap => {
    S.files = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
    S.filesLoaded = true; if(S.filesFor === id) renderMain();
  }, () => { S.filesLoaded = true; renderMain(); });
}
const brandRef = id => S.db.doc("brands/" + id);
const fileCol = id => S.db.collection("brands/" + id + "/files");
async function touch(id, data){ await brandRef(id).update({...data, updatedAt: now()}); }

async function fetchBlob(assetId){ const r = await fetch(blobUrl(assetId)); if(!r.ok) throw {userMsg:"تعذّر جلب الملف."}; return r.blob(); }
async function saveAs(name, data){
  try { await S.downloads.save({filename:name, data}); toast("تم التحميل"); }
  catch(e){ if(e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "انتظر قليلًا ثم أعد المحاولة" : "تعذّر التحميل في هذا العرض"); }
}
const safeName = s => String(s||"file").replace(/[\\/:*?"<>|]+/g,"-").trim().slice(0,120);

async function exportImg(b, f, fmt, size){
  toast("جارٍ التجهيز…");
  try {
    const img = new Image(); img.src = blobUrl(f.assetId); await img.decode();
    let w = img.naturalWidth, h = img.naturalHeight;
    if(f.contentType === "image/svg+xml"){ if(!w || !h){ w = 1000; h = 1000; } h = Math.round(h * size / w); w = size; }
    else { w = Math.round(w*size); h = Math.round(h*size); }
    const cap = 8000; if(Math.max(w,h) > cap){ const k = cap/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
    const c = document.createElement("canvas"); c.width = w; c.height = h; const ctx = c.getContext("2d");
    if(fmt === "jpg"){ ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0,0,w,h); }
    ctx.drawImage(img,0,0,w,h);
    const mime = fmt === "jpg" ? "image/jpeg" : fmt === "webp" ? "image/webp" : "image/png";
    const blob = await new Promise(r => c.toBlob(r, mime, .92));
    if(!blob) throw 0;
    await saveAs(`${safeName(b.name)} - ${safeName(f.title||"logo")} - ${w}px.${fmt}`, blob);
  } catch { toast("تعذّر تحويل الصورة"); }
}

/* ---------- modal ---------- */
function modal({title, body, saveLabel="حفظ", onSave, onOpen, wide}){
  const wrap = document.createElement("div"); wrap.className = "modal-wrap";
  wrap.innerHTML = `<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="إغلاق">✕</button></header><div class="modal-body">${body}</div><p class="modal-err" hidden></p><footer>${onSave?`<button class="btn primary" data-save>${esc(saveLabel)}</button>`:""}<button class="btn ghost" data-close>إلغاء</button></footer></div>`;
  $("#app").appendChild(wrap);
  const close = () => wrap.remove();
  wrap.addEventListener("mousedown", e => { if(e.target === wrap) close(); });
  wrap.addEventListener("click", e => { if(e.target.closest("[data-close]")) close(); });
  const err = wrap.querySelector(".modal-err"); const sb = wrap.querySelector("[data-save]");
  wrap.fail = m => { err.textContent = m; err.hidden = false; };
  sb && sb.addEventListener("click", async () => {
    err.hidden = true; sb.disabled = true; const old = sb.textContent; sb.textContent = "جارٍ الحفظ…";
    try { const r = await onSave(wrap, t => { sb.textContent = t; }); if(r !== false) close(); }
    catch(e){ console.error(e); wrap.fail(msgFor(e)); }
    finally { sb.disabled = false; sb.textContent = old; }
  });
  onOpen && onOpen(wrap);
  const first = wrap.querySelector(".modal-body input:not([type=radio]):not([type=file]),.modal-body textarea"); first && first.focus();
  return wrap;
}
document.addEventListener("keydown", e => { if(e.key === "Escape"){ const w = [...document.querySelectorAll(".modal-wrap")].pop(); w && w.remove(); } });
const val = (w,s) => (w.querySelector(s)?.value ?? "").trim();
const fail = m => { throw {userMsg:m}; };

        if(m === "up" && i > 0) [rows[i-1], rows[i]] = [rows[i], rows[i-1]];
        if(m === "down" && i < rows.length-1) [rows[i+1], rows[i]] = [rows[i], rows[i+1]];
        draw(w); });
    },
    onSave: async (w, step) => {
      for(const f of rows){ if(!String(f.name||"").trim() && !pending[f._k]) fail("اكتب اسم كل خط أو احذف الصف الفارغ."); if(f.driveUrl && !/^https:\/\//i.test(f.driveUrl.trim())) fail("روابط درايف يجب أن تبدأ بـ https://"); }
      for(const f of rows){ const file = pending[f._k]; if(!file) continue; step("جارٍ رفع " + file.name + "…"); const ext = extOf(file.name);
        const up = await S.assets.upload(file, {type: TYPES[ext]}); f.assetId = up.id; f.filename = file.name; f.contentType = up.contentType; delete pending[f._k]; }
      const out = rows.map(({_k, ...f}) => ({name:String(f.name||"").trim(), role:f.role||"", weights:(f.weights||"").trim(), usage:(f.usage||"").trim(), driveUrl:(f.driveUrl||"").trim(), google:!!f.google, assetId:f.assetId||"", filename:f.filename||"", contentType:f.contentType||""}));
      const kept = new Set(out.map(f=>f.assetId).filter(Boolean));
      const removed = (b.fonts||[]).map(f=>f.assetId).filter(id => id && !kept.has(id) && !fontRefElsewhere(id, b.id) && !S.files.some(x => x.assetId === id));
      await touch(b.id, {fonts:out});
      for(const id of removed) if(S.assets){ try { await S.assets.delete(id); } catch {} }
      toast("تم حفظ الخطوط");
    }});
}

/* general rules: a small, safe Markdown subset (headings, lists, checklists, pipe tables) */
function mdInline(s){ return esc(s).replace(/#([0-9A-Fa-f]{6})\b/g, (m,h) => `<span class="hexchip" dir="ltr"><i style="background:#${h}"></i>#${h.toUpperCase()}</span>`); }
function mdRender(src){
  const out = []; let list = null, table = null, sec = 0;
  const flushList = () => { if(list){ out.push(`<${list.tag}${list.cls?` class="${list.cls}"`:""}>${list.items.join("")}</${list.tag}>`); list = null; } };
  const flushTable = () => { if(table){ const [head, ...rows] = table; out.push(`<div class="mdt"><table><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); table = null; } };
  for(const raw of String(src).split("\n")){
    const line = raw.trim(); let mm;
    if(line.startsWith("|")){ flushList(); const cells = line.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()); if(cells.every(c => /^:?-{2,}:?$/.test(c))) continue; (table ||= []).push(cells); continue; }
    flushTable();
    if(!line){ flushList(); continue; }
    if((mm = /^(#{1,4})\s+(.*)$/.exec(line))){ flushList(); const lv = Math.min(4, mm[1].length + 1); out.push(`<h${lv}${mm[1].length === 2 ? ` id="gr-${sec++}"` : ""}>${mdInline(mm[2])}</h${lv}>`); continue; }
    if((mm = /^- \[( |x)\]\s+(.*)$/i.exec(line))){ if(!list || list.cls !== "check") { flushList(); list = {tag:"ul", cls:"check", items:[]}; } list.items.push(`<li><span class="box" aria-hidden="true"></span>${mdInline(mm[2])}</li>`); continue; }
    if((mm = /^[-•*]\s+(.*)$/.exec(line))){ if(!list || list.cls) { flushList(); list = {tag:"ul", cls:"", items:[]}; } list.items.push(`<li>${mdInline(mm[1])}</li>`); continue; }
    flushList(); out.push(`<p>${mdInline(line)}</p>`);
  }
  flushList(); flushTable(); return out.join("");
}
function rulesView(){
  const m = master(), GR = String(m?.generalRules || "").trim(), ed = S.canEdit && m;
  const heads = GR.split("\n").filter(l => /^##\s+/.test(l.trim())).map(l => l.trim().replace(/^##\s+/, ""));
  let h = `<div class="intro"><div><span class="eyebrow">تسري على كل الهويات</span><h1>ضوابط تصميمات الأكاديمية</h1><p>الضوابط العامة لكل تصاميم أكاديمية هندسة الأجيال وبرامجها ومشاريعها ومنتجاتها. تُقرأ مع ضوابط الهوية الخاصة بكل برنامج، وهي مضمّنة تلقائيًا في برومبت كل هوية.</p></div>

---
${base}`;

      return {file, ext, ok, why: !TYPES[ext] ? `صيغة ${ext.toUpperCase()||"?"} ← درايف` : file.size > limitFor(ext) ? `${fmtSize(file.size)} ← درايف` : "ملف فارغ"}; });
    if(picked.length === 1 && !val(w,"#f-title")) w.querySelector("#f-title").value = picked[0].file.name.replace(/\.[^.]+$/,"");

      }

      picked = picked.filter(p => !p.done);
      toast(`تم رفع ${ok.length} ${ok.length===1?"ملف":"ملفات"}`);
      if(picked.length){ drawPicked(w); w.querySelector("input[value=drive]").click(); return false; }
    }});
}
function editFile(b, f){
  const w = modal({title:"تعديل الملف",
    body:`<label class="field"><span>العنوان</span><input id="e-title" value="${esc(f.title||"")}"></label>
      <div class="two"><label class="field"><span>التصنيف</span><select id="e-cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===f.category?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="field"><span>النسخة / الوصف</span><input id="e-var" value="${esc(f.variant||"")}"></label></div>
      <label class="field"><span>ملاحظة</span><input id="e-note" value="${esc(f.note||"")}"></label>
      ${f.driveUrl?`<label class="field"><span>رابط درايف</span><input id="e-url" dir="ltr" value="${esc(f.driveUrl)}"></label>`:""}
      ${isImg(f)?`<label class="check"><input type="checkbox" id="e-cover" ${b.coverAsset===f.assetId?"checked":""}><span>اجعله الشعار الرئيسي لهذه الصفحة (يظهر في الرأس والبطاقات)</span></label>`:""}
      <div class="danger-zone"><span class="hint">${f.assetId?"الحذف يزيل الملف من الموقع نهائيًا.":"الحذف يزيل الرابط فقط، والملف يبقى على درايف."}</span><button class="btn sm danger" id="e-del">حذف الملف</button></div>`,
    onSave: async w => {
      const d = {title:val(w,"#e-title"), category:val(w,"#e-cat"), variant:val(w,"#e-var"), note:val(w,"#e-note")};
      if(f.driveUrl){ const u = val(w,"#e-url"); if(!/^https:\/\//i.test(u)) fail("الرابط يجب أن يبدأ بـ https://"); d.driveUrl = u; }
      await fileCol(b.id).doc(f.id).update(d);
      const cv = w.querySelector("#e-cover");
      if(cv){ if(cv.checked && b.coverAsset !== f.assetId) await touch(b.id, {coverAsset:f.assetId}); else if(!cv.checked && b.coverAsset === f.assetId) await touch(b.id, {coverAsset:""}); }
      toast("تم الحفظ");
    }});
  const del = w.querySelector("#e-del");
  del.addEventListener("click", async () => {
    if(!del.dataset.sure){ del.dataset.sure = "1"; del.textContent = "تأكيد الحذف النهائي"; return; }
    del.disabled = true;
    try {
      await fileCol(b.id).doc(f.id).delete();
      const usedByFont = S.brands.some(x => (x.fonts||[]).some(ff => ff.assetId === f.assetId));
      if(f.assetId && S.assets && !usedByFont){ try { await S.assets.delete(f.assetId); } catch {} }
      if(b.coverAsset && b.coverAsset === f.assetId){ const next = S.files.find(x => x.id !== f.id && x.category === "logo" && isImg(x)); await touch(b.id, {coverAsset: next ? next.assetId : ""}); }
      w.remove(); toast("تم حذف الملف");
    } catch(e){ w.fail(msgFor(e)); del.disabled = false; }
  });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if(!t || t.closest(".modal-wrap")) return;
  const a = t.dataset.act; const b = curBrand(); const f = t.dataset.id ? S.files.find(x => x.id === t.dataset.id) : null;
  const menu = t.closest("details.menu"); if(menu) menu.removeAttribute("open");
  switch(a){
    case "copy": copy(t.dataset.text, t.dataset.label); break;
    case "jump": document.getElementById(t.dataset.to)?.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); break;
    case "new-brand": if(S.canEdit) newBrand(t.dataset.kind); break;
    case "edit-info": b && editInfo(b); break;
    case "edit-colors": b && editColors(b); break;
    case "edit-fonts": b && editFonts(b); break;
    case "edit-grads": b && editGradients(b); break;
    case "dl-grad": { const g = gradsOf(b)[+t.dataset.i]; if(g && S.downloads) saveAs(`${safeName(b.name)} - ${safeName(g.name||"gradient")}.svg`, gradSvg(g)); break; }
    case "edit-rules": b && editRules(b); break;
    case "edit-general": if(S.canEdit) editGeneral(); break;
    case "dl-general": saveAs("الضوابط العامة لتصاميم أكاديمية هندسة الأجيال.md", generalMd()); break;
    case "copy-general": copy(generalMd(), "الضوابط العامة"); break;
    case "edit-prompt": b && editPrompt(b); break;
    case "add-file": b && addFile(b, t.dataset.cat); break;
    case "edit-file": b && f && editFile(b, f); break;
    case "filter": S.fileFilter = t.dataset.cat; renderMain(); break;
    case "bg": if(f){ const order = ["checker","light","dark","brand"]; S.tileBg[f.id] = order[(order.indexOf(S.tileBg[f.id]||"checker")+1) % order.length]; const art = t.closest(".tile").querySelector(".tile-art"); art.className = "tile-art bg-" + S.tileBg[f.id]; if(S.tileBg[f.id]==="brand") art.style.setProperty("--band", primaryOf(b)||"#003375"); } break;
